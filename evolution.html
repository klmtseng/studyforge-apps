<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>三態進化圖鑑</title>
<style>
 *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
 :root{--bg:#0f1420;--card:#1a2130;--card2:#232c3f;--tx:#e8edf6;--dim:#95a0b5;--line:#2c3547;
   --ok:#28c76f;--bad:#ea5455;--warn:#ff9f43;--blue:#4f8cff;--gold:#f6c343}
 body{font-family:-apple-system,"PingFang TC","Noto Sans TC",system-ui,sans-serif;
   background:var(--bg);color:var(--tx);line-height:1.55;-webkit-text-size-adjust:100%;
   min-height:100vh;display:flex;flex-direction:column}
 .warnbar{background:#5b2530;color:#fff;padding:10px 14px;font-size:13px;text-align:center}
 header{padding:16px 16px 8px;text-align:center}
 h1{font-size:19px}
 .sub{color:var(--dim);font-size:12px;margin-top:2px}
 nav{display:flex;gap:8px;padding:10px 14px;position:sticky;top:0;z-index:10;
   background:linear-gradient(180deg,var(--bg) 75%,transparent)}
 .navbtn{flex:1;padding:10px 4px;text-align:center;border-radius:12px;font-size:14px;
   background:var(--card);border:1px solid var(--line);color:var(--dim);cursor:pointer;user-select:none}
 .navbtn.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
 main{flex:1;padding:6px 14px 40px;max-width:640px;margin:0 auto;width:100%}
 footer{padding:14px;text-align:center;color:#4a5468;font-size:10.5px}
 .hidden{display:none!important}

 /* ===== 訓練 ===== */
 .daybar{display:flex;gap:8px;margin-top:8px}
 .daycell{flex:1;text-align:center;padding:8px 4px;border-radius:12px;background:var(--card);
   border:1px solid var(--line)}
 .daycell b{display:block;font-size:17px}
 .daycell span{font-size:11px;color:var(--dim)}
 .qcard{margin-top:14px;border-radius:18px;border:1px solid var(--line);background:var(--card);
   padding:22px 18px;text-align:center}
 .stagechip{display:inline-block;font-size:11.5px;padding:3px 12px;border-radius:12px;
   background:var(--card2);color:var(--dim)}
 .stagechip.evo{background:rgba(246,195,67,.15);color:var(--gold)}
 .qverb{font-size:34px;font-weight:800;margin-top:10px;letter-spacing:.5px}
 .qzh{font-size:14px;color:var(--dim);margin-top:2px}
 .qask{font-size:14.5px;margin-top:14px}
 .qask b{color:var(--gold)}
 .ansrow{display:flex;gap:8px;margin-top:12px}
 .ansrow input{flex:1;background:var(--card2);color:var(--tx);border:1.5px solid var(--line);
   border-radius:12px;padding:13px;font-size:18px;text-align:center;font-family:inherit;min-width:0}
 .ansrow input:focus{outline:none;border-color:var(--blue)}
 .ansrow button{padding:13px 18px;border-radius:12px;border:none;background:var(--blue);
   color:#fff;font-size:15px;font-weight:700;cursor:pointer;flex:none}
 .qcard.good{border-color:var(--ok);background:linear-gradient(160deg,#16281e,#1a2130)}
 .qcard.bad{border-color:var(--bad)}
 .verdict{margin-top:12px;font-size:15px;min-height:22px}
 .verdict.ok{color:var(--ok);font-weight:700}
 .verdict.no{color:var(--bad)}
 .rightans{margin-top:6px;font-size:20px;font-weight:800;color:var(--gold)}
 .trapnote{margin-top:8px;font-size:12px;color:var(--warn);background:rgba(255,159,67,.08);
   border-radius:8px;padding:6px 10px;text-align:left}
 .nextbtn{margin-top:14px;padding:12px 30px;border-radius:12px;border:none;background:var(--card2);
   color:var(--tx);font-size:15px;font-weight:700;cursor:pointer}
 .evoup{font-size:13px;color:var(--gold);margin-top:8px;font-weight:700}
 /* 教學卡 */
 .teach{margin-top:14px;border-radius:18px;border:1.5px solid var(--gold);background:var(--card);
   padding:20px 18px;text-align:center}
 .teach .tag{font-size:12px;color:var(--gold);font-weight:700}
 .forms3{display:flex;justify-content:center;gap:10px;margin-top:12px;flex-wrap:wrap;align-items:baseline}
 .forms3 .fv{font-size:22px;font-weight:800}
 .forms3 .arrow{color:var(--dim)}
 .forms3 .f2{color:var(--gold)}
 .forms3 .f3{color:#9ad0ff}
 .famchip{display:inline-block;margin-top:10px;font-size:11.5px;padding:3px 12px;border-radius:12px;
   background:var(--card2);color:var(--dim)}
 .donebox{text-align:center;padding:40px 16px}
 .donebox .big{font-size:46px}
 .donebox h2{margin-top:10px;font-size:18px}
 .donebox p{color:var(--dim);font-size:13.5px;margin-top:6px}
 .streak{margin-top:12px;font-size:14px;color:var(--gold);font-weight:700}

 /* ===== 圖鑑 ===== */
 .prog{color:var(--dim);font-size:13px;text-align:center;margin-top:8px}
 .stagesum{display:flex;gap:8px;margin-top:10px}
 .stagesum .daycell b{font-size:19px}
 .gcard{border-radius:14px;border:1px solid var(--line);background:var(--card);margin-top:10px;overflow:hidden}
 .ghead{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;user-select:none}
 .fdot{width:11px;height:11px;border-radius:50%;flex:none}
 .gname{font-size:14.5px;font-weight:700;flex:1}
 .gnum{font-size:12px;color:var(--dim);flex:none}
 .gbody{display:none;border-top:1px solid var(--line)}
 .gcard.open .gbody{display:block}
 .vrow{display:flex;align-items:baseline;gap:8px;padding:8px 14px;border-top:1px solid #202839;
   flex-wrap:wrap;font-size:14px;cursor:pointer}
 .vrow:first-child{border-top:none}
 .vstage{flex:none;width:22px;text-align:center}
 .vrow b{min-width:78px}
 .vrow .ved{color:var(--gold)}
 .vrow .vpp{color:#9ad0ff}
 .vrow .zh{color:var(--dim);font-size:11.5px;margin-left:auto}
 .wbadge{font-size:10.5px;color:var(--bad);border:1px solid rgba(234,84,85,.4);border-radius:8px;padding:0 6px}

 /* ===== 錯題本 ===== */
 .misscard{display:flex;align-items:center;gap:10px;border-radius:14px;border:1px solid var(--line);
   background:var(--card);margin-top:10px;padding:12px 14px}
 .missverb{font-size:16px;font-weight:800}
 .missinfo{font-size:12px;color:var(--dim)}
 .missn{margin-left:auto;font-size:13px;color:var(--bad);font-weight:700;flex:none}
 .drillbtn{flex:none;padding:8px 14px;border-radius:10px;border:none;background:var(--blue);
   color:#fff;font-size:13px;font-weight:700;cursor:pointer}
 .emptynote{color:var(--dim);text-align:center;padding:40px 20px;font-size:13.5px}
 .resetbtn{display:block;margin:26px auto 0;padding:9px 20px;border-radius:12px;font-size:12px;
   border:1px solid var(--line);background:none;color:#57627a;cursor:pointer}

 .confetti{position:fixed;top:-30px;font-size:20px;z-index:99;pointer-events:none;animation:fall linear forwards}
 @keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.4}}
 @keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.25)}100%{transform:scale(1)}}
 .pop{animation:pop .45s}
</style>
</head>

const STAGE_EMOJI=["🥚","🐣","⚡","👑"]; // 未介紹/訓練中/進化型(ved穩)/究極(vpp穩)

let S; try{S=JSON.parse(localStorage.getItem(LS))||{}}catch(e){S={}}
S.st=S.st||{}; S.log=S.log||{}; S.intro=S.intro||0;
const save=()=>localStorage.setItem(LS,JSON.stringify(S));
const today=()=>Math.floor((Date.now()-new Date().getTimezoneOffset()*60000)/864e5);

/* ---------- 小工具 ---------- */
const $=s=>document.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const safeColor=c=>/^#[0-9a-fA-F]{3,8}$/.test(c)?c:"#8a94a6";
const norm=s=>s.toLowerCase().trim().replace(/\s+/g," ");
function boom(){const em=["🎉","🐉","✨","⭐"];for(let i=0;i<22;i++){const c=el("span","confetti",em[i%4]);
  c.style.left=Math.random()*100+"vw";c.style.animationDuration=(1.6+Math.random()*1.6)+"s";
  document.body.appendChild(c);setTimeout(()=>c.remove(),3400)}}
function stageOf(v){const t=S.st[v];if(!t)return 0;
  if((t.b3||0)>=UNLOCK)return 3;if((t.b2||0)>=UNLOCK)return 2;return 1}
function logToday(k){const d=today();S.log[d]=S.log[d]||{n:0,r:0,w:0};S.log[d][k]++;save()}
function streak(){let n=0,d=today();while(S.log[d]&&(S.log[d].n+S.log[d].r)>0){n++;d--}return n}

/* ---------- 排程核心 ---------- */
function dueItems(){ // 到期複習(不含新卡);先到期的先出
  const d=today(),q=[];
  for(const [v,t] of Object.entries(S.st)){
    if(t.d2<=d)q.push({v,f:2,due:t.d2,teach:!!t.teach});
    if((t.b2||0)>=UNLOCK&&(t.b3===undefined||t.d3<=d))q.push({v,f:3,due:t.d3===undefined?d:t.d3});
  }
  return q.sort((a,b)=>a.due-b.due);
}
function newBudget(){const d=today();return Math.max(0,CFG.new_per_day-((S.log[d]||{}).n||0))}
function answer(v,f,correct){ // 更新盒子與到期日;回傳升級訊息
  const t=S.st[v]=S.st[v]||{seen:today()};
  const bk=f===2?"b2":"b3",dk=f===2?"d2":"d3",wk=f===2?"w2":"w3";
  const before=stageOf(v);
  if(correct){t[bk]=Math.min((t[bk]===undefined?0:t[bk])+1,MAXBOX);t[dk]=today()+BOX[t[bk]];}
  else{t[bk]=0;t[dk]=today();t[wk]=(t[wk]||0)+1;}
  logToday(correct?"r":"w");save();
  const after=stageOf(v);
  return after>before?after:0;
}

/* ---------- 導覽 ---------- */
document.querySelectorAll(".navbtn").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".navbtn").forEach(x=>x.classList.toggle("on",x===b));
  ["train","dex","miss"].forEach(v=>$("#view-"+v).classList.toggle("hidden",v!==b.dataset.v));
  if(b.dataset.v==="train")renderTrain();
  if(b.dataset.v==="dex")renderDex();
  if(b.dataset.v==="miss")renderMiss();
});

/* ---------- 訓練 ---------- */
let Q=[]; // 本節佇列:{v,f,teach?}
function buildQueue(){
  Q=dueItems();
  let budget=newBudget();
  while(budget>0&&S.intro<CARDS.length){
    const nv=CARDS[S.intro].v;
    if(!S.st[nv])S.st[nv]={seen:today(),d2:today(),teach:1}; // 先入排程,教學卡沒看完也不會漏
    Q.push({v:nv,f:2,teach:true});
    S.intro++;budget--;logToday("n");
  }
  save();
}
function renderTrain(){
  const box=$("#view-train");box.innerHTML="";
  if(!Q.length)buildQueue();
  const d=today(),lg=S.log[d]||{n:0,r:0,w:0};
  const bar=el("div","daybar");
  [[Q.length,"待練"],[lg.r,"今日答對"],[lg.w,"今日答錯"],[streak(),"連續天數"]]
    .forEach(([n,l])=>{const c=el("div","daycell");c.appendChild(el("b",null,String(n)));
      c.appendChild(el("span",null,l));bar.appendChild(c)});
  box.appendChild(bar);
  if(!Q.length){ // 今天沒事了
    const nd=Object.values(S.st).map(t=>Math.min(t.d2??1e9,t.d3??1e9)).filter(x=>x>d);
    const done=el("div","donebox");
    done.appendChild(el("div","big","🏝️"));
    done.appendChild(el("h2",null,"今天的訓練完成！"));
    done.appendChild(el("p",null,`答對 ${lg.r} 題、答錯 ${lg.w} 題、認識 ${lg.n} 隻新化石`));
    if(nd.length)done.appendChild(el("p",null,`下一批 ${nd.filter(x=>x===Math.min(...nd)).length} 張卡 ${Math.min(...nd)-d} 天後到期`));
    if(streak()>1)done.appendChild(el("div","streak",`🔥 連續 ${streak()} 天訓練`));
    box.appendChild(done);
    return;
  }
  const item=Q[0];
  if(item.teach)renderTeach(box,item);else renderQuiz(box,item);
}
function renderTeach(box,item){
  const v=item.v,info=V[v],g=G[info.g];
  const t=el("div","teach");
  t.appendChild(el("div","tag","🆕 新化石出土！先看清楚三態——"));
  t.appendChild(el("div","qverb",esc(v)));
  t.appendChild(el("div","qzh",esc(info.zh)));
  const f3=el("div","forms3");
  f3.innerHTML=`<span class="fv">${esc(v)}</span><span class="arrow">→</span>`+
    `<span class="fv f2">${esc(info.ved)}</span><span class="arrow">→</span>`+
    `<span class="fv f3">${esc(info.vpp)}</span>`;
  t.appendChild(f3);
  const chip=el("div","famchip",`<span class="fdot" style="display:inline-block;background:${safeColor(g.color)}"></span> ${esc(g.name)}`);
  t.appendChild(chip);
  if(info.trap)t.appendChild(el("div","trapnote","⚠️ "+esc(info.trap)));
  const btn=el("button","nextbtn","記住了，馬上考我 ▶");
  btn.onclick=()=>{item.teach=false;S.st[v]=S.st[v]||{seen:today()};delete S.st[v].teach;save();renderTrain()};
  t.appendChild(btn);
  box.appendChild(t);
}
function renderQuiz(box,item){
  const v=item.v,info=V[v],card=CARD_BY_V[v];
  const isNewVpp=item.f===3&&S.st[v]&&S.st[v].b3===undefined;
  const q=el("div","qcard");
  q.appendChild(el("div","stagechip"+(item.f===3?" evo":""),
    item.f===3?(isNewVpp?"👑 究極進化解鎖！第一次挑戰過去分詞":"👑 究極訓練（過去分詞）"):"⚡ 進化訓練（過去式）"));
  q.appendChild(el("div","qverb",esc(v)));
  q.appendChild(el("div","qzh",esc(info.zh)));
  q.appendChild(el("div","qask",item.f===2?"它的<b>過去式</b>是什麼？":"它的<b>過去分詞</b>是什麼？（I have ___）"));
  const row=el("div","ansrow");
  const inp=document.createElement("input");
  inp.type="text";inp.autocapitalize="none";inp.autocomplete="off";inp.spellcheck=false;
  inp.setAttribute("autocorrect","off");inp.setAttribute("enterkeyhint","done");
  inp.placeholder=item.f===2?"輸入過去式…":"輸入過去分詞…";
  const btn=el("button",null,"送出");
  row.appendChild(inp);row.appendChild(btn);
  q.appendChild(row);
  const verdict=el("div","verdict");q.appendChild(verdict);
  box.appendChild(q);
  inp.focus();
  const submit=()=>{
    const ans=norm(inp.value);
    if(!ans)return;
    inp.disabled=btn.disabled=true;
    const okList=item.f===2?card.ved_ok:card.vpp_ok;
    const correct=okList.includes(ans);
    const up=answer(v,item.f,correct);
    Q.shift();
    if(correct){
      q.classList.add("good");verdict.className="verdict ok";verdict.textContent="✅ 答對了！";
      if(up)q.appendChild(el("div","evoup",up===3?`👑 ${v} 進化成究極體！`:`⚡ ${v} 進化了！過去分詞訓練解鎖`));
      if(up)q.classList.add("pop");
      setTimeout(()=>{if(!Q.length)boom();renderTrain()},up?1400:700);
    }else{
      q.classList.add("bad");verdict.className="verdict no";verdict.textContent="❌ 差一點——正確答案：";
      q.insertBefore(el("div","rightans",esc(item.f===2?info.ved:info.vpp)),verdict.nextSibling);
      if(info.trap)q.appendChild(el("div","trapnote","⚠️ "+esc(info.trap)));
      Q.push({v:item.v,f:item.f}); // 本節稍後再考一次
      const nb=el("button","nextbtn","知道了，繼續 ▶");
      nb.onclick=()=>renderTrain();
      q.appendChild(nb);
    }
  };
  btn.onclick=submit;
  inp.addEventListener("keydown",e=>{if(e.key==="Enter")submit()});
}

/* ---------- 圖鑑 ---------- */
function renderDex(){
  const box=$("#view-dex");box.innerHTML="";
  const counts=[0,0,0,0];
  CARDS.forEach(c=>counts[stageOf(c.v)]++);
  box.appendChild(el("div","prog",`把每一隻從 🥚 養到 👑——過去式穩定變 ⚡，過去分詞也穩定變 👑`));
  const sum=el("div","stagesum daybar");
  [["🥚 未出土",counts[0]],["🐣 訓練中",counts[1]],["⚡ 進化型",counts[2]],["👑 究極體",counts[3]]]
    .forEach(([l,n])=>{const c=el("div","daycell");c.appendChild(el("b",null,String(n)));
      c.appendChild(el("span",null,l));sum.appendChild(c)});
  box.appendChild(sum);
  Object.keys(G).forEach(gid=>{
    const g=G[gid],members=CARDS.filter(c=>c.g===gid);
    const c=el("div","gcard");
    const head=el("div","ghead");
    const dot=el("div","fdot");dot.style.background=safeColor(g.color);
    head.appendChild(dot);
    head.appendChild(el("div","gname",esc(g.name)));
    const mastered=members.filter(m=>stageOf(m.v)>=2).length;
    head.appendChild(el("div","gnum",`⚡${mastered}/${members.length}`));
    c.appendChild(head);
    const body=el("div","gbody");
    members.forEach(m=>{
      const info=V[m.v],t=S.st[m.v]||{},w=(t.w2||0)+(t.w3||0);
      const r=el("div","vrow");
      r.innerHTML=`<span class="vstage">${STAGE_EMOJI[stageOf(m.v)]}</span><b>${esc(m.v)}</b>`+
        `<span class="ved">${esc(info.ved)}</span><span class="vpp">${esc(info.vpp)}</span>`+
        (w?`<span class="wbadge">錯${w}次</span>`:"")+
        `<span class="zh">${esc(info.zh)}</span>`;
      body.appendChild(r);
    });
    c.appendChild(body);
    head.onclick=()=>c.classList.toggle("open");
    box.appendChild(c);
  });
}

/* ---------- 錯題本 ---------- */
function renderMiss(){
  const box=$("#view-miss");box.innerHTML="";
  const rows=[];
  for(const [v,t] of Object.entries(S.st)){
    const w=(t.w2||0)+(t.w3||0);
    if(w>0)rows.push({v,w,w2:t.w2||0,w3:t.w3||0});
  }
  rows.sort((a,b)=>b.w-a.w);
  if(!rows.length){
    box.appendChild(el("div","emptynote","錯題本是空的——目前為止全都答對，繼續保持！<br>答錯的動詞會自動記在這裡，而且會更常出現在訓練裡。"));
  }else{
    box.appendChild(el("div","prog",`${rows.length} 隻動詞曾經咬過你——點「馬上練」直接開練`));
    rows.forEach(r=>{
      const info=V[r.v];
      const c=el("div","misscard");
      const left=el("div","");
      left.appendChild(el("div","missverb",esc(r.v)));
      left.appendChild(el("div","missinfo",
        `${esc(info.ved)} / ${esc(info.vpp)}　${r.w2?`過去式錯${r.w2}`:""}${r.w2&&r.w3?"、":""}${r.w3?`分詞錯${r.w3}`:""}`));
      c.appendChild(left);
      c.appendChild(el("div","missn",`×${r.w}`));
      const db=el("button","drillbtn","馬上練");
      db.onclick=()=>{
        Q.unshift({v:r.v,f:r.w3>r.w2?3:2});
        document.querySelector('.navbtn[data-v=train]').click();
      };
      c.appendChild(db);
      box.appendChild(c);
    });
  }
  const rb=el("button","resetbtn","重新開始（清除全部進度與錯題）");
  rb.onclick=()=>{if(confirm("確定要清掉所有進度、圖鑑和錯題紀錄嗎？")){localStorage.removeItem(LS);location.reload()}};
  box.appendChild(rb);
}

renderTrain();
</script>
</body>
</html>
