<title>短文時態挑戰</title>
<style>
 *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
 :root{--bg:#0f1420;--card:#1a2130;--card2:#232c3f;--tx:#e8edf6;--dim:#95a0b5;--line:#2c3547;
   --ok:#28c76f;--bad:#ea5455;--warn:#ff9f43;--blue:#4f8cff}
 body{font-family:-apple-system,"PingFang TC","Noto Sans TC",system-ui,sans-serif;
   background:var(--bg);color:var(--tx);line-height:1.65;min-height:100vh}
 .warnbar{background:#5b2530;color:#fff;padding:12px;text-align:center;font-size:13px}
 header{padding:16px 16px 8px;text-align:center}
 h1{font-size:19px}
 .sub{color:var(--dim);font-size:12px;margin-top:2px}
 main{padding:8px 14px 60px;max-width:640px;margin:0 auto}
 .hidden{display:none!important}
 /* 選單 */
 .modehint{background:var(--card);border:1px solid var(--line);border-radius:14px;
   padding:12px 14px;margin-top:10px;font-size:12.5px;color:#cdd6e6}
 .modehint b{color:#8fb6ff}
 .plist{margin-top:12px;display:grid;gap:10px}
 .pcard{background:var(--card);border:1px solid var(--line);border-radius:14px;
   padding:14px;cursor:pointer;user-select:none}
 .pcard:active{background:var(--card2)}
 .pt{font-size:16px;font-weight:700}
 .pz{color:var(--dim);font-size:12.5px;margin-top:2px}
 .pbest{font-size:11.5px;margin-top:6px;color:var(--dim)}
 .pbest b{color:#ffd166}
 .modebtns{display:flex;gap:8px;margin-top:10px}
 .mb{flex:1;text-align:center;padding:9px;border-radius:10px;font-size:13px;font-weight:700;
   cursor:pointer;user-select:none;border:1px solid var(--line);background:var(--card2)}
 .mb.cloze{color:#8fb6ff}.mb.fix{color:#ffb37f}
 /* 遊戲 */
 .topbar{display:flex;align-items:center;gap:10px;margin-top:10px}
 .back{font-size:13px;color:var(--dim);cursor:pointer;user-select:none;
   border:1px solid var(--line);border-radius:10px;padding:6px 12px}
 .ttl{font-weight:800;font-size:16px;flex:1}
 .scoreline{font-size:12px;color:var(--dim)}
 .story{background:var(--card);border:1px solid var(--line);border-radius:16px;
   padding:18px 16px;margin-top:12px;font-size:17.5px;line-height:2.05}
 .blank{display:inline-block;min-width:74px;text-align:center;border-bottom:2px dashed var(--blue);
   color:#8fb6ff;cursor:pointer;user-select:none;font-weight:700;border-radius:6px;padding:0 6px}
 .blank.cur{background:rgba(79,140,255,.18)}
 .blank.good{border-bottom-color:var(--ok);color:#7fe0ab;border-bottom-style:solid}
 .blank.bad{border-bottom-color:var(--bad);color:#ff9e9e;border-bottom-style:solid}
 .fword{cursor:pointer;user-select:none;border-radius:6px;padding:0 4px;font-weight:700;
   border-bottom:2px solid transparent}
 .fword.suspect{background:rgba(255,159,67,.2);border-bottom:2px dashed var(--warn);color:#ffcf9e}
 .fword.good{background:rgba(40,199,111,.15);color:#7fe0ab}
 .fword.bad{background:rgba(234,84,85,.18);color:#ff9e9e;text-decoration:line-through}
 .fword.fixed{background:rgba(40,199,111,.15);color:#7fe0ab;text-decoration:none}
 .panel{position:sticky;bottom:10px;background:var(--card2);border:1px solid var(--line);
   border-radius:16px;padding:13px;margin-top:14px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
 .pq{font-size:13px;color:var(--dim);text-align:center}
 .pq b{color:var(--tx)}
 .popts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
 .po{padding:11px;border-radius:11px;background:var(--card);border:1px solid var(--line);
   text-align:center;font-size:16px;font-weight:700;cursor:pointer;user-select:none}
 .po.right{background:#1e5138;border-color:var(--ok)}
 .po.wrong{background:#5b2530;border-color:var(--bad)}
 .why{margin-top:10px;font-size:12.5px;border-radius:9px;padding:8px 10px;display:none}
 .why.show{display:block}
 .why.good{background:rgba(40,199,111,.12);color:#7fe0ab}
 .why.bad{background:rgba(234,84,85,.12);color:#ff9e9e}
 .why .clue{color:var(--warn)}
 .nextb{margin-top:10px;text-align:center}
 .nbtn{display:inline-block;padding:11px 30px;border-radius:12px;background:var(--blue);
   color:#fff;font-weight:700;cursor:pointer;user-select:none;font-size:14px}
 .checkbar{text-align:center;margin-top:14px}
 .donebox{text-align:center;padding:30px 14px}
 .donebox .n{font-size:48px;font-weight:800}
 .donebox p{color:var(--dim);margin-top:6px;font-size:13.5px}
 footer{text-align:center;color:#525d72;font-size:10.5px;padding:14px}
</style>
</head>

function forms(raw){return raw.replace(/[（(].*?[)）]/g,' ').split(/[\/,]/)
 .map(s=>s.trim().toLowerCase()).filter(s=>/^[a-z][a-z ]*$/.test(s));}
function optionsFor(b){
 const v=VI[b.verb]||{};
 const set=new Set([b.verb,b.verb+'s',...forms(v.ved||''),...forms(v.vpp||'')]);
 set.add(b.answer.toLowerCase());
 let arr=[...set];
 // 最多 4 個選項：答案 + 隨機挑其他形態
 const ans=b.answer.toLowerCase();
 arr=arr.filter(x=>x!==ans).sort(()=>Math.random()-.5).slice(0,3);
 return [ans,...arr].sort(()=>Math.random()-.5);
}
function wrongFormFor(b){
 const opts=optionsFor(b).filter(x=>x!==b.answer.toLowerCase());
 return opts[Math.floor(Math.random()*opts.length)]||b.verb;
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;');}

    <div class="pt">${p.title}</div><div class="pz">${p.zh} ‧ ${p.blanks.length} 個關卡</div>
    <div class="pbest">${st.cloze!=null?`📝 最佳 <b>${st.cloze}</b>`:'📝 未挑戰'}
     ${st.fix!=null?`🔍 最佳 <b>${st.fix}</b>`:'🔍 未挑戰'}</div>
    <div class="modebtns"><span class="mb cloze" data-m="cloze">📝 選時態</span>
     <span class="mb fix" data-m="fix">🔍 抓錯字</span></div></div>`;}).join('')}</div>`;
 el.querySelectorAll('.mb').forEach(b=>b.onclick=e=>{
  const i=+b.closest('.pcard').dataset.i;
  b.dataset.m==='cloze'?playCloze(PS[i]):playFix(PS[i]);
 });
}

/* ============ 模式一：選時態 ============ */
function playCloze(p){
 const el=document.getElementById('main');
 let right=0,done=0,cur=null;
 el.innerHTML=`<div class="topbar"><span class="back">← 回選單</span>
   <span class="ttl">${p.title}</span><span class="scoreline" id="sl">0 / ${p.blanks.length}</span></div>
  <div class="story" id="story"></div><div class="panel" id="panel">
   <div class="pq">點故事裡的 <b>虛線空格</b> 開始作答</div></div>`;
 el.querySelector('.back').onclick=home;
 const bmap=Object.fromEntries(p.blanks.map(b=>[b.n,b]));
 document.getElementById('story').innerHTML=
  esc(p.text).replace(/\{\{(\d+)\}\}/g,(_,n)=>
   `<span class="blank" data-n="${n}" id="bk${n}">____</span>`);
 const panel=document.getElementById('panel');
 document.querySelectorAll('.blank').forEach(bk=>bk.onclick=()=>{
  if(bk.dataset.done)return;
  document.querySelectorAll('.blank').forEach(x=>x.classList.remove('cur'));
  bk.classList.add('cur');cur=bmap[+bk.dataset.n];
  const v=VI[cur.verb]||{};
  panel.innerHTML=`<div class="pq">空格 ${cur.n}：<b>${cur.verb}</b> ${v.kk||''} ${v.zh||''} 該用哪個形態？</div>
   <div class="popts">${optionsFor(cur).map(o=>`<div class="po" data-o="${o}">${o}</div>`).join('')}</div>
   <div class="why" id="why"></div><div class="nextb" id="nb"></div>`;
  panel.querySelectorAll('.po').forEach(po=>po.onclick=()=>{
   if(bk.dataset.done)return;bk.dataset.done=1;
   const good=po.dataset.o===cur.answer.toLowerCase();
   panel.querySelectorAll('.po').forEach(x=>{
    if(x.dataset.o===cur.answer.toLowerCase())x.classList.add('right');
    else if(x===po)x.classList.add('wrong');});
   bk.textContent=cur.answer;bk.classList.remove('cur');
   bk.classList.add(good?'good':'bad');
   if(good)right++;done++;
   document.getElementById('sl').textContent=`${right} / ${p.blanks.length}`;
   const v2=VI[cur.verb]||{};
   const w=document.getElementById('why');
   w.className='why show '+(good?'good':'bad');
   w.innerHTML=`${good?'✅':'❌ 正解 <b>'+cur.answer+'</b>。'} `+
    `線索 <span class="clue">「${cur.clue}」</span>→ ${TENSE_ZH[cur.tense]}。${cur.why}`+
    `<br>三態：${cur.verb} → ${v2.ved||'?'} → ${v2.vpp||'?'}${v2.trap?`　⚠️ ${v2.trap}`:''}`;
   if(done===p.blanks.length){
    const st=P[p.id]||(P[p.id]={});
    st.cloze=Math.max(st.cloze||0,right);save();
    document.getElementById('nb').innerHTML=`<span class="nbtn">完成！回選單 →</span>`;
    document.querySelector('.nbtn').onclick=home;
   }
  });
 });
}

/* ============ 模式二：抓錯字 ============ */
function playFix(p){
 const el=document.getElementById('main');
 // 每個空格 60% 塞錯形態、40% 塞正確；至少 2 個錯
 let plan;
 do{ plan=p.blanks.map(b=>({b,wrong:Math.random()<.6}));
 }while(plan.filter(x=>x.wrong).length<2);
 plan.forEach(x=>{x.shown=x.wrong?wrongFormFor(x.b):x.b.answer.toLowerCase();});
 const nWrong=plan.filter(x=>x.wrong).length;
 let el2;
 el.innerHTML=`<div class="topbar"><span class="back">← 回選單</span>
   <span class="ttl">${p.title}</span><span class="scoreline">錯字 ${nWrong} 個</span></div>
  <div class="modehint">這篇故事裡有 <b>${nWrong} 個動詞</b>被偷改成錯的時態。
   點你覺得錯的字（可多選），再按「檢查答案」。</div>
  <div class="story" id="story"></div>
  <div class="checkbar"><span class="nbtn" id="chk">🔍 檢查答案</span></div>
  <div id="fixes"></div>`;
 el.querySelector('.back').onclick=home;
 const pmap=Object.fromEntries(plan.map(x=>[x.b.n,x]));
 document.getElementById('story').innerHTML=
  esc(p.text).replace(/\{\{(\d+)\}\}/g,(_,n)=>
   `<span class="fword" data-n="${n}">${pmap[n].shown}</span>`);
 document.querySelectorAll('.fword').forEach(w=>w.onclick=()=>{
  if(w.dataset.lock)return;w.classList.toggle('suspect');});
 document.getElementById('chk').onclick=()=>{
  let score=0;
  document.querySelectorAll('.fword').forEach(w=>{
   w.dataset.lock=1;const x=pmap[+w.dataset.n];
   const marked=w.classList.contains('suspect');
   w.classList.remove('suspect');
   if(x.wrong&&marked){score++;w.classList.add('bad');}
   else if(x.wrong&&!marked){w.classList.add('bad');}
   else if(!x.wrong&&marked){w.classList.add('good');score--;}
   else w.classList.add('good');
  });
  score=Math.max(0,score);
  const fx=document.getElementById('fixes');
  const wrongs=plan.filter(x=>x.wrong);
  fx.innerHTML=`<div class="modehint">抓錯得分 <b>${score} / ${nWrong}</b>
    （誤抓正確的字會扣分）。現在把抓到的錯字改對：</div>`+
   wrongs.map(x=>{const v=VI[x.b.verb]||{};
    return `<div class="panel" data-n="${x.b.n}">
    <div class="pq">「<b>${x.shown}</b>」是錯的 → <b>${x.b.verb}</b>（${v.zh||''}）在這裡該用？</div>
    <div class="popts">${optionsFor(x.b).map(o=>`<div class="po" data-o="${o}">${o}</div>`).join('')}</div>
    <div class="why"></div></div>`;}).join('')+
   `<div class="nextb"><span class="nbtn" id="fin" style="display:none">完成！回選單 →</span></div>`;
  let fixedCount=0;
  fx.querySelectorAll('.panel').forEach(pn=>{
   const x=pmap[+pn.dataset.n];
   pn.querySelectorAll('.po').forEach(po=>po.onclick=()=>{
    if(pn.dataset.done)return;pn.dataset.done=1;
    const good=po.dataset.o===x.b.answer.toLowerCase();
    pn.querySelectorAll('.po').forEach(y=>{
     if(y.dataset.o===x.b.answer.toLowerCase())y.classList.add('right');
     else if(y===po)y.classList.add('wrong');});
    const w=pn.querySelector('.why');const v2=VI[x.b.verb]||{};
    w.className='why show '+(good?'good':'bad');
    w.innerHTML=`${good?'✅ 改對了！':'❌ 正解 <b>'+x.b.answer+'</b>。'} `+
     `線索 <span class="clue">「${x.b.clue}」</span>→ ${TENSE_ZH[x.b.tense]}。${x.b.why}`;
    if(good){score+=0;const word=document.querySelector('.fword[data-n="'+x.b.n+'"]');
     word.textContent=x.b.answer;word.classList.remove('bad');word.classList.add('fixed');}
    fixedCount++;
    if(fixedCount===wrongs.length){
     const st=P[p.id]||(P[p.id]={});
     st.fix=Math.max(st.fix||0,score);save();
     document.getElementById('fin').style.display='inline-block';
     document.getElementById('fin').onclick=home;
    }
   });
  });
  document.getElementById('chk').style.display='none';
 };
}
home();
</script>
