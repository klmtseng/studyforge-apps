<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>不規則動詞三態</title>
<style>
 *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
 :root{--bg:#0f1420;--card:#1a2130;--card2:#232c3f;--tx:#e8edf6;--dim:#95a0b5;--line:#2c3547;
   --ok:#28c76f;--bad:#ea5455;--warn:#ff9f43;--blue:#4f8cff}
 body{font-family:-apple-system,"PingFang TC","Noto Sans TC",system-ui,sans-serif;
   background:var(--bg);color:var(--tx);line-height:1.55;-webkit-text-size-adjust:100%;
   min-height:100vh;display:flex;flex-direction:column}
 header{padding:16px 16px 10px;text-align:center}
 h1{font-size:19px}
 .sub{color:var(--dim);font-size:12px;margin-top:2px}
 nav{display:flex;gap:8px;padding:10px 14px;position:sticky;top:0;z-index:10;
   background:linear-gradient(180deg,var(--bg) 75%,transparent)}
 .navbtn{flex:1;padding:10px 4px;text-align:center;border-radius:12px;font-size:14px;
   background:var(--card);border:1px solid var(--line);color:var(--dim);cursor:pointer;user-select:none}
 .navbtn.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
 main{flex:1;padding:6px 14px 40px;max-width:640px;margin:0 auto;width:100%}
 .hidden{display:none!important}

 /* ===== 學規律 ===== */
 .gcard{border-radius:14px;border:1px solid var(--line);background:var(--card);
   margin-top:12px;overflow:hidden}
 .ghead{display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer}
 .gdot{width:11px;height:11px;border-radius:50%;flex:none}
 .gname{font-size:15.5px;font-weight:700;flex:1}
 .gnum{font-size:12px;color:var(--dim)}
 .gprog{height:4px;background:var(--card2)}
 .gprog i{display:block;height:100%;background:var(--ok);width:0%}
 .ghint{padding:2px 14px 10px;color:var(--dim);font-size:12.5px}
 .gbody{display:none;border-top:1px solid var(--line)}
 .gcard.open .gbody{display:block}
 .vrow{display:flex;align-items:baseline;gap:8px;padding:10px 14px;border-top:1px solid #202839;flex-wrap:wrap}
 .vrow:first-child{border-top:none}
 .vv{font-size:16px;font-weight:700;min-width:86px}
 .vkk{font-size:11px;color:var(--dim)}
 .vforms{font-size:14.5px;color:#ffd166;width:100%;padding-left:2px}
 .vforms b{color:#ffd166}
 .vzh{font-size:12.5px;color:var(--dim)}
 .vtrap{width:100%;font-size:12px;color:var(--warn);background:rgba(255,159,67,.08);
   border-left:2px solid var(--warn);padding:4px 8px;border-radius:4px;margin-top:2px}
 .star{margin-left:auto;font-size:15px;color:#556;cursor:pointer;user-select:none}
 .star.on{color:#f6c343}

 /* ===== 翻卡 ===== */
 .pickbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
 .pick{font-size:12px;padding:6px 11px;border-radius:16px;border:1px solid var(--line);
   background:var(--card);color:var(--dim);cursor:pointer;user-select:none}
 .pick.on{color:#fff;border-color:var(--blue);background:rgba(79,140,255,.25)}
 .flashwrap{margin-top:14px;perspective:900px}
 .flash{position:relative;border-radius:18px;min-height:240px;cursor:pointer;
   transform-style:preserve-3d;transition:transform .35s}
 .flash.flip{transform:rotateY(180deg)}
 .face{position:absolute;inset:0;border-radius:18px;padding:22px;backface-visibility:hidden;
   display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
   border:1px solid var(--line)}
 .front{background:linear-gradient(160deg,#1c2740,#171e2e)}
 .back{background:linear-gradient(160deg,#1e3226,#16211b);transform:rotateY(180deg)}
 .fv{font-size:34px;font-weight:800;letter-spacing:.5px}
 .fkk{color:var(--dim);margin-top:4px}
 .fzh{font-size:16px;color:#cdd6e6;margin-top:8px}
 .ftip{position:absolute;bottom:12px;left:0;right:0;font-size:11px;color:var(--dim)}
 .bform{font-size:15px;color:var(--dim);margin-top:8px}
 .bform b{font-size:24px;color:#ffd166;display:block;margin-top:1px}
 .btrap{font-size:12px;color:var(--warn);margin-top:10px;padding:5px 10px;
   background:rgba(255,159,67,.1);border-radius:8px}
 .gradebar{display:flex;gap:10px;margin-top:14px}
 .gbtn{flex:1;padding:14px;border-radius:14px;font-size:16px;font-weight:700;text-align:center;
   cursor:pointer;user-select:none;border:none;color:#fff}
 .gbtn.no{background:#5b2530}
 .gbtn.yes{background:#1e5138}
 .fmeta{display:flex;justify-content:space-between;color:var(--dim);font-size:12px;margin-top:10px}
 .donebox{text-align:center;padding:50px 20px}
 .donebox .big{font-size:44px}
 .donebox p{color:var(--dim);margin-top:8px;font-size:14px}
 .again{margin-top:18px;display:inline-block;padding:12px 26px;border-radius:14px;
   background:var(--blue);color:#fff;font-weight:700;cursor:pointer;user-select:none}

 /* ===== 小考 ===== */
 .qhead{display:flex;justify-content:space-between;align-items:center;margin-top:14px;
   color:var(--dim);font-size:13px}
 .qbar{height:6px;background:var(--card2);border-radius:3px;margin-top:8px;overflow:hidden}
 .qbar i{display:block;height:100%;background:var(--blue);transition:width .3s}
 .qcard{background:var(--card);border:1px solid var(--line);border-radius:16px;
   padding:20px;margin-top:14px;text-align:center}
 .qq{font-size:15px;color:var(--dim)}
 .qv{font-size:30px;font-weight:800;margin-top:6px}
 .qzh{color:var(--dim);font-size:13.5px;margin-top:3px}
 .opts{margin-top:16px;display:grid;gap:10px}
 .opt{padding:13px;border-radius:12px;background:var(--card2);border:1px solid var(--line);
   font-size:17px;font-weight:600;cursor:pointer;user-select:none}
 .opt.right{background:#1e5138;border-color:var(--ok)}
 .opt.wrong{background:#5b2530;border-color:var(--bad)}
 .opt.dim{opacity:.45}
 .qnext{margin-top:16px;padding:12px 30px;border-radius:12px;background:var(--blue);
   color:#fff;font-weight:700;display:inline-block;cursor:pointer;user-select:none}
 .qtrap{margin-top:12px;font-size:12.5px;color:var(--warn)}
 .scorebox{text-align:center;padding:40px 16px}
 .scorebox .n{font-size:56px;font-weight:800}
 .scorebox .msg{margin-top:6px;color:var(--dim)}
 .review{margin-top:18px;text-align:left;background:var(--card);border:1px solid var(--line);
   border-radius:14px;padding:6px 14px}
 .review .vrow{padding:10px 0}
 footer{text-align:center;color:#525d72;font-size:10.5px;padding:14px}
</style>
</head>

 {"v": "spell", "kk": "[spɛl]", "zh": "拼字", "ved": "spelled / spelt", "vpp": "spelled / spelt", "g": "solo", "trap": "兩種都可：spelled 或 spelt"}, {"v": "spend", "kk": "[spɛnd]", "zh": "花費", "ved": "spent", "vpp": "spent", "g": "dt"}, {"v": "spread", "kk": "[sprɛd]", "zh": "展開；擴散", "ved": "spread", "vpp": "spread", "g": "aaa"}, {"v": "stand", "kk": "[stænd]", "zh": "站立", "ved": "stood", "vpp": "stood", "g": "aid"}, {"v": "steal", "kk": "[stil]", "zh": "偷竊", "ved": "stole", "vpp": "stolen", "g": "oen"}, {"v": "strike", "kk": "[straɪk]", "zh": "毆打；擊", "ved": "struck", "vpp": "struck / stricken", "g": "abb", "trap": "第三態兩種：struck 或 stricken"}, {"v": "swear", "kk": "[swɛr]", "zh": "發誓", "ved": "swore", "vpp": "sworn", "g": "orn"}, {"v": "sweep", "kk": "[swip]", "zh": "掃；掃除", "ved": "swept", "vpp": "swept", "g": "ept"}, {"v": "swim", "kk": "[swɪm]", "zh": "游泳", "ved": "swam", "vpp": "swum", "g": "iau"}, {"v": "swing", "kk": "[swɪŋ]", "zh": "搖擺；擺動", "ved": "swung", "vpp": "swung", "g": "abb", "trap": "不是 i-a-u！直接 swung-swung"}, {"v": "take", "kk": "[tek]", "zh": "拿取", "ved": "took", "vpp": "taken", "g": "solo"}, {"v": "teach", "kk": "[titʃ]", "zh": "教導", "ved": "taught", "vpp": "taught", "g": "ought"}, {"v": "tear", "kk": "[tɛr]", "zh": "撕；扯開", "ved": "tore", "vpp": "torn", "g": "orn"}, {"v": "tell", "kk": "[tɛl]", "zh": "告訴", "ved": "told", "vpp": "told", "g": "aid"}, {"v": "think", "kk": "[θɪŋk]", "zh": "想；認為", "ved": "thought", "vpp": "thought", "g": "ought"}, {"v": "throw", "kk": "[θro]", "zh": "丟", "ved": "threw", "vpp": "thrown", "g": "ew"}, {"v": "understand", "kk": "[͵ʌndɚˋstænd]", "zh": "懂", "ved": "understood", "vpp": "understood", "g": "aid"}, {"v": "upset", "kk": "[ʌpˋsɛt]", "zh": "使煩惱", "ved": "upset", "vpp": "upset", "g": "aaa"}, {"v": "wake", "kk": "[wek]", "zh": "醒來", "ved": "woke", "vpp": "woken", "g": "oen"}, {"v": "wear", "kk": "[wɛr]", "zh": "穿著", "ved": "wore", "vpp": "worn", "g": "orn"}, {"v": "weave", "kk": "[wiv]", "zh": "編織", "ved": "wove", "vpp": "woven", "g": "oen"}, {"v": "weep", "kk": "[wip]", "zh": "哭泣", "ved": "wept", "vpp": "wept", "g": "ept"}, {"v": "wet", "kk": "[wɛt]", "zh": "弄濕", "ved": "wet", "vpp": "wet", "g": "aaa"}, {"v": "win", "kk": "[wɪn]", "zh": "贏得", "ved": "won", "vpp": "won", "g": "abb", "trap": "won 唸 [wʌn]，跟 one 同音"}, {"v": "write", "kk": "[raɪt]", "zh": "寫", "ved": "wrote", "vpp": "written", "g": "itten", "trap": "written 要雙寫 tt"}]};
const V=DATA.verbs, G=DATA.groups;
const gmap=Object.fromEntries(G.map(g=>[g.id,g]));
const byG=id=>V.filter(v=>v.g===id);
document.getElementById('subline').textContent=
 `${V.length} 個不規則動詞 ‧ ${G.length} 個規律小隊 ‧ 來源：${DATA.meta.source_desc}`;

/* ---------- 進度存檔 ---------- */
const KEY='sf_'+DATA.meta.title;
let P={};try{P=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const save=()=>localStorage.setItem(KEY,JSON.stringify(P));
const rec=v=>P[v]||(P[v]={box:0,star:0});

/* ---------- 導覽 ---------- */
document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('.navbtn').forEach(x=>x.classList.remove('on'));
 b.classList.add('on');
 ['learn','flash','quiz'].forEach(m=>
   document.getElementById('pg-'+m).classList.toggle('hidden',m!==b.dataset.m));
 if(b.dataset.m==='learn')renderLearn();
});

/* ---------- 學規律 ---------- */
function renderLearn(){
 const el=document.getElementById('pg-learn');el.innerHTML='';
 G.forEach(g=>{
  const vs=byG(g.id);if(!vs.length)return;
  const done=vs.filter(v=>rec(v.v).box>=2).length;
  const c=document.createElement('div');c.className='gcard';
  c.innerHTML=`<div class="ghead"><span class="gdot" style="background:${g.color}"></span>
    <span class="gname">${g.name}</span><span class="gnum">${done}/${vs.length} 熟</span></div>
   <div class="ghint">💡 ${g.hint}</div>
   <div class="gprog"><i style="width:${vs.length?Math.round(done/vs.length*100):0}%"></i></div>
   <div class="gbody">${vs.map(v=>`
    <div class="vrow">
      <span class="vv">${v.v}</span><span class="vkk">${v.kk}</span>
      <span class="vzh">${v.zh}</span>
      <span class="star ${rec(v.v).star?'on':''}" data-v="${v.v}">★</span>
      <span class="vforms">→ <b>${v.ved}</b> → <b>${v.vpp}</b></span>
      ${v.trap?`<span class="vtrap">⚠️ ${v.trap}</span>`:''}
    </div>`).join('')}</div>`;
  c.querySelector('.ghead').onclick=()=>c.classList.toggle('open');
  c.querySelectorAll('.star').forEach(s=>s.onclick=e=>{
    e.stopPropagation();const r=rec(s.dataset.v);r.star=r.star?0:1;save();
    s.classList.toggle('on');});
  el.appendChild(c);
 });
}
renderLearn();

/* ---------- 翻卡自測 ---------- */
let deck=[],idx=0,scope='all';
function renderFlashHome(){
 const el=document.getElementById('pg-flash');
 const opts=[['all','全部'],['weak','不熟優先'],['star','★星號'],...G.map(g=>[g.id,g.name])];
 el.innerHTML=`<div class="pickbar">${opts.map(([id,n])=>
   `<span class="pick ${id===scope?'on':''}" data-s="${id}">${n}</span>`).join('')}</div>
  <div id="flashzone"></div>`;
 el.querySelectorAll('.pick').forEach(p=>p.onclick=()=>{scope=p.dataset.s;renderFlashHome();startDeck();});
 startDeck();
}
function pool(){
 if(scope==='all')return[...V];
 if(scope==='star')return V.filter(v=>rec(v.v).star);
 if(scope==='weak')return[...V].sort((a,b)=>rec(a.v).box-rec(b.v).box).slice(0,20);
 return byG(scope);
}
function startDeck(){
 deck=pool();for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));
   [deck[i],deck[j]]=[deck[j],deck[i]];}
 idx=0;showCard();
}
function showCard(){
 const z=document.getElementById('flashzone');
 if(!deck.length){z.innerHTML=`<div class="donebox"><div class="big">🤷</div>
   <p>這個範圍沒有卡片（先去按幾顆★吧）</p></div>`;return;}
 if(idx>=deck.length){
  z.innerHTML=`<div class="donebox"><div class="big">🎉</div>
   <p>這一輪 ${deck.length} 張完成！<br>答「不熟」的卡會自動排進下一輪的「不熟優先」。</p>
   <span class="again" id="againBtn">再來一輪</span></div>`;
  document.getElementById('againBtn').onclick=startDeck;return;
 }
 const v=deck[idx];
 z.innerHTML=`
  <div class="flashwrap"><div class="flash" id="fc">
   <div class="face front"><div class="fv">${v.v}</div><div class="fkk">${v.kk}</div>
     <div class="fzh">${v.zh}</div><div class="ftip">先在心裡唸出三態，再點卡片對答案</div></div>
   <div class="face back">
     <div class="bform">過去式 Ved<b>${v.ved}</b></div>
     <div class="bform">過去分詞 Vp.p.<b>${v.vpp}</b></div>
     ${v.trap?`<div class="btrap">⚠️ ${v.trap}</div>`:''}</div>
  </div></div>
  <div class="gradebar hidden" id="gb">
   <div class="gbtn no">😵 不熟</div><div class="gbtn yes">😎 我會了</div></div>
  <div class="fmeta"><span>${gmap[v.g].name}</span><span>${idx+1} / ${deck.length}</span></div>`;
 const fc=document.getElementById('fc'),gb=document.getElementById('gb');
 fc.onclick=()=>{fc.classList.toggle('flip');gb.classList.remove('hidden');};
 gb.querySelector('.no').onclick=()=>{const r=rec(v.v);r.box=0;save();
   deck.push(v);idx++;showCard();};
 gb.querySelector('.yes').onclick=()=>{const r=rec(v.v);r.box=Math.min(3,r.box+1);save();
   idx++;showCard();};
}
renderFlashHome();

/* ---------- 小考 ---------- */
const QN=10;let quiz=[],qi=0,qscore=0,qwrong=[];
function makeQuiz(){
 const vs=[...V].sort(()=>Math.random()-.5).slice(0,QN);
 quiz=vs.map(v=>{
  const askPP=Math.random()<.5;
  const ans=askPP?v.vpp:v.ved;
  const others=V.filter(x=>x.v!==v.v).map(x=>askPP?x.vpp:x.ved)
    .filter(f=>f!==ans);
  const dis=[...new Set(others)].sort(()=>Math.random()-.5).slice(0,3);
  const opts=[ans,...dis].sort(()=>Math.random()-.5);
  return{v,askPP,ans,opts};
 });
 qi=0;qscore=0;qwrong=[];showQ();
}
function showQ(){
 const el=document.getElementById('pg-quiz');
 if(qi>=quiz.length){
  const pct=Math.round(qscore/quiz.length*100);
  el.innerHTML=`<div class="scorebox"><div class="n">${qscore}/${quiz.length}</div>
   <div class="msg">${pct===100?'太神啦！滿分 🏆':pct>=70?'不錯喔，再衝一次更穩 💪':'沒關係，錯的都是寶，看下面複習 📖'}</div>
   ${qwrong.length?`<div class="review">${qwrong.map(q=>`
     <div class="vrow"><span class="vv">${q.v.v}</span><span class="vzh">${q.v.zh}</span>
     <span class="vforms">→ <b>${q.v.ved}</b> → <b>${q.v.vpp}</b></span>
     ${q.v.trap?`<span class="vtrap">⚠️ ${q.v.trap}</span>`:''}</div>`).join('')}</div>`:''}
   <span class="again" id="qAgain">再考一次</span></div>`;
  document.getElementById('qAgain').onclick=makeQuiz;return;
 }
 const q=quiz[qi];
 el.innerHTML=`<div class="qhead"><span>第 ${qi+1} / ${quiz.length} 題</span>
   <span>答對 ${qscore}</span></div>
  <div class="qbar"><i style="width:${qi/quiz.length*100}%"></i></div>
  <div class="qcard"><div class="qq">${q.askPP?'過去分詞 Vp.p.':'過去式 Ved'} 是哪個？</div>
   <div class="qv">${q.v.v}</div><div class="qzh">${q.v.kk}　${q.v.zh}</div>
   <div class="opts">${q.opts.map(o=>`<div class="opt" data-o="${o.replace(/"/g,'&quot;')}">${o}</div>`).join('')}</div>
   <div id="qfb"></div></div>`;
 el.querySelectorAll('.opt').forEach(op=>op.onclick=()=>{
  if(el.dataset.lock)return;el.dataset.lock=1;
  const pick=op.dataset.o,right=pick===q.ans;
  el.querySelectorAll('.opt').forEach(x=>{
    if(x.dataset.o===q.ans)x.classList.add('right');
    else if(x===op)x.classList.add('wrong');else x.classList.add('dim');});
  if(right){qscore++;const r=rec(q.v.v);r.box=Math.min(3,r.box+1);save();}
  else{qwrong.push(q);const r=rec(q.v.v);r.box=0;save();}
  document.getElementById('qfb').innerHTML=
   `${q.v.trap?`<div class="qtrap">⚠️ ${q.v.trap}</div>`:''}
    <span class="qnext" id="qn">${qi+1===quiz.length?'看成績':'下一題'} →</span>`;
  document.getElementById('qn').onclick=()=>{delete el.dataset.lock;qi++;showQ();};
 });
}
makeQuiz();
</script>
