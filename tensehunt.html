<style>
 *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
 :root{--bg:#0f1420;--card:#1a2130;--card2:#232c3f;--tx:#e8edf6;--dim:#95a0b5;--line:#2c3547;
   --ok:#28c76f;--bad:#ea5455;--warn:#ff9f43;--blue:#4f8cff}
 body{font-family:-apple-system,"PingFang TC","Noto Sans TC",system-ui,sans-serif;
   background:var(--bg);color:var(--tx);line-height:1.6;min-height:100vh}
 .warnbar{background:#5b2530;color:#fff;padding:12px;text-align:center;font-size:13px}
 header{padding:16px 16px 8px;text-align:center}
 h1{font-size:19px}
 .sub{color:var(--dim);font-size:12px;margin-top:2px}
 main{padding:8px 14px 50px;max-width:640px;margin:0 auto}
 .target{background:linear-gradient(160deg,#1c2740,#171e2e);border:1px solid var(--line);
   border-radius:16px;padding:16px;text-align:center;margin-top:10px;position:sticky;top:8px;z-index:5}
 .tlabel{font-size:12px;color:var(--dim)}
 .tv{font-size:30px;font-weight:800;margin-top:2px}
 .tzh{color:var(--dim);font-size:13.5px;margin-top:2px}
 .tprog{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);margin-top:8px}
 .mission{margin:12px 2px 4px;font-size:13px;color:#cdd6e6}
 .sent{background:var(--card);border:1px solid var(--line);border-radius:14px;
   padding:13px 14px;margin-top:10px}
 .sent.done{opacity:.82}
 .sent.done.good{border-color:var(--ok)}
 .sent.done.miss{border-color:var(--bad)}
 .words{font-size:17px;line-height:2}
 .w{cursor:pointer;border-radius:6px;padding:1px 3px}
 .w:active{background:var(--card2)}
 .w.hit{background:#1e5138;color:#fff;font-weight:700}
 .w.no{background:#5b2530;color:#fff}
 .w.reveal{background:rgba(255,159,67,.25);border-bottom:2px solid var(--warn);font-weight:700}
 .nonebtn{margin-top:8px;display:inline-block;font-size:12.5px;color:var(--dim);
   border:1px dashed var(--line);border-radius:16px;padding:5px 12px;cursor:pointer;user-select:none}
 .nonebtn.hit{background:#1e5138;color:#fff;border-style:solid}
 .nonebtn.no{background:#5b2530;color:#fff;border-style:solid}
 .tensepick{margin-top:10px;display:none;gap:8px}
 .tensepick.show{display:grid}
 .tp{padding:11px;border-radius:11px;background:var(--card2);border:1px solid var(--line);
   text-align:center;font-size:14px;font-weight:600;cursor:pointer;user-select:none}
 .tp small{display:block;font-weight:400;font-size:10.5px;color:var(--dim)}
 .tp.right{background:#1e5138;border-color:var(--ok)}
 .tp.wrong{background:#5b2530;border-color:var(--bad)}
 .fb{margin-top:9px;font-size:12.5px;border-radius:8px;padding:7px 10px;display:none}
 .fb.show{display:block}
 .fb.good{background:rgba(40,199,111,.12);color:#7fe0ab}
 .fb.bad{background:rgba(234,84,85,.12);color:#ff9e9e}
 .nextbar{text-align:center;margin-top:16px}
 .nextbtn{display:inline-block;padding:13px 34px;border-radius:14px;background:var(--blue);
   color:#fff;font-weight:700;cursor:pointer;user-select:none}
 .scorebox{text-align:center;padding:36px 16px}
 .scorebox .n{font-size:52px;font-weight:800}
 .scorebox .msg{margin-top:6px;color:var(--dim);font-size:14px}
 footer{text-align:center;color:#525d72;font-size:10.5px;padding:14px}
</style>
</head>

t"}, "set": {"v": "set", "kk": "[sɛt]", "zh": "安置；安裝", "ved": "set", "vpp": "set", "g": "aaa"}, "shake": {"v": "shake", "kk": "[ʃek]", "zh": "搖動", "ved": "shook", "vpp": "shaken", "g": "solo", "trap": "跟 take-took-taken 同款"}, "shine": {"v": "shine", "kk": "[ʃaɪn]", "zh": "照耀；擦亮", "ved": "shone（照耀）/ shined（擦亮）", "vpp": "shone（照耀）/ shined（擦亮）", "g": "solo", "trap": "照耀用 shone、擦亮用 shined"}, "shoot": {"v": "shoot", "kk": "[ʃut]", "zh": "發射", "ved": "shot", "vpp": "shot", "g": "abb"}, "show": {"v": "show", "kk": "[ʃo]", "zh": "表示；展現", "ved": "showed", "vpp": "shown", "g": "solo", "trap": "過去式規則(showed)、第三態不規則(shown)"}, "shut": {"v": "shut", "kk": "[ʃʌt]", "zh": "關閉", "ved": "shut", "vpp": "shut", "g": "aaa"}, "sing": {"v": "sing", "kk": "[sɪŋ]", "zh": "唱歌", "ved": "sang", "vpp": "sung", "g": "iau"}, "sink": {"v": "sink", "kk": "[sɪŋk]", "zh": "下沉", "ved": "sank", "vpp": "sunk", "g": "iau"}, "sit": {"v": "sit", "kk": "[sɪt]", "zh": "坐", "ved": "sat", "vpp": "sat", "g": "abb"}, "sleep": {"v": "sleep", "kk": "[slip]", "zh": "睡", "ved": "slept", "vpp": "slept", "g": "ept"}, "slide": {"v": "slide", "kk": "[slaɪd]", "zh": "滑；滑動", "ved": "slid", "vpp": "slid", "g": "abb"}, "speak": {"v": "speak", "kk": "[spik]", "zh": "說；演講", "ved": "spoke", "vpp": "spoken", "g": "oen"}, "spell": {"v": "spell", "kk": "[spɛl]", "zh": "拼字", "ved": "spelled / spelt", "vpp": "spelled / spelt", "g": "solo", "trap": "兩種都可：spelled 或 spelt"}, "spend": {"v": "spend", "kk": "[spɛnd]", "zh": "花費", "ved": "spent", "vpp": "spent", "g": "dt"}, "spread": {"v": "spread", "kk": "[sprɛd]", "zh": "展開；擴散", "ved": "spread", "vpp": "spread", "g": "aaa"}, "stand": {"v": "stand", "kk": "[stænd]", "zh": "站立", "ved": "stood", "vpp": "stood", "g": "aid"}, "steal": {"v": "steal", "kk": "[stil]", "zh": "偷竊", "ved": "stole", "vpp": "stolen", "g": "oen"}, "strike": {"v": "strike", "kk": "[straɪk]", "zh": "毆打；擊", "ved": "struck", "vpp": "struck / stricken", "g": "abb", "trap": "第三態兩種：struck 或 stricken"}, "swear": {"v": "swear const ITEMS=DATA.items, VI=DATA.verbinfo||{};
const TENSE_ZH={present:'現在式',past:'過去式 Ved',pp:'過去分詞 Vp.p.'};
document.getElementById('subline').textContent=
 `${ITEMS.length} 個動詞 ‧ ${ITEMS.reduce((a,x)=>a+x.sentences.length,0)} 個例句 ‧ 在句子裡獵出動詞、判斷時態`;

/* 進度 */
const KEY='sf_hunt_'+DATA.meta.title;
let P={};try{P=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const save=()=>localStorage.setItem(KEY,JSON.stringify(P));
P.total=P.total||0;P.right=P.right||0;

let order=[...ITEMS.keys()].sort(()=>Math.random()-.5),oi=0;
let score={hit:0,all:0};

function forms(raw){return raw.replace(/[（(].*?[)）]/g,' ').split(/[\/,]/)
 .map(s=>s.trim().toLowerCase()).filter(s=>/^[a-z][a-z ]*$/.test(s));}
function targetForms(base){
 const v=VI[base]||{};
 return new Set([base,base+'s',base+'es',...forms(v.ved||''),...forms(v.vpp||'')]);
}

function newRound(){
 if(oi>=order.length){order=order.sort(()=>Math.random()-.5);oi=0;}
 const item=ITEMS[order[oi++]];
 const base=item.verb,v=VI[base]||{},tf=targetForms(base);
 // 目標句 2-3 句 + 干擾句補到 5 句（干擾句不得含目標動詞任何形態）
 const mine=[...item.sentences].sort(()=>Math.random()-.5)
   .slice(0,2+Math.floor(Math.random()*2))
   .map(s=>({...s,verb:base,has:true}));
 const others=ITEMS.filter(x=>x.verb!==base)
   .flatMap(x=>x.sentences.map(s=>({...s,verb:x.verb,has:false})))
   .filter(s=>!s.text.toLowerCase().match(/[a-z']+/g).some(w=>tf.has(w)))
   .sort(()=>Math.random()-.5).slice(0,5-mine.length);
 const sents=[...mine,...others].sort(()=>Math.random()-.5);
 renderRound(base,v,sents);
}

function renderRound(base,v,sents){
 const el=document.getElementById('main');
 let solved=0;
 el.innerHTML=`
  <div class="target"><div class="tlabel">🎯 目標動詞</div>
   <div class="tv">${base}</div>
   <div class="tzh">${v.kk||''}　${v.zh||''}</div>
   <div class="tprog"><span id="rp">0 / ${sents.length} 句完成</span>
    <span>累計答對 ${P.right} / ${P.total}</span></div></div>
  <div class="mission">任務：下面每一句——有 <b>${base}</b> 家族的字就<b>點那個字</b>；
   整句都沒有就按「這句沒有它」。</div>
  <div id="sents"></div><div class="nextbar" id="nb"></div>`;
 const holder=document.getElementById('sents');
 const tf=targetForms(base);

 sents.forEach((s,si)=>{
  const box=document.createElement('div');box.className='sent';
  const words=s.text.split(/(\s+)/);
  box.innerHTML=`<div class="words">${words.map(w=>{
    const core=w.replace(/[^A-Za-z']/g,'');
    return core?`<span class="w" data-w="${core.toLowerCase()}">${w}</span>`:w;
   }).join('')}</div>
   <span class="nonebtn">🚫 這句沒有它</span>
   <div class="tensepick"></div><div class="fb"></div>`;
  const fb=box.querySelector('.fb'), tp=box.querySelector('.tensepick'),
        nb=box.querySelector('.nonebtn');
  let stage='hunt';

  function finish(good){
   box.classList.add('done',good?'good':'miss');
   score.all++;P.total++;if(good){score.hit++;P.right++;}save();
   solved++;document.getElementById('rp').textContent=`${solved} / ${sents.length} 句完成`;
   if(solved===sents.length)
     document.getElementById('nb').innerHTML=`<span class="nextbtn" id="nx">下一回合 →</span>`,
     document.getElementById('nx').onclick=newRound;
  }
  function reveal(){
   if(s.has)box.querySelectorAll('.w').forEach(x=>{
     if(x.dataset.w===s.form.toLowerCase())x.classList.add('reveal');});
  }

  box.querySelectorAll('.w').forEach(w=>w.onclick=()=>{
   if(stage!=='hunt')return;
   const tapped=w.dataset.w;
   if(s.has&&tapped===s.form.toLowerCase()){
    w.classList.add('hit');stage='tense';
    tp.innerHTML=Object.entries(TENSE_ZH).map(([k,n])=>
     `<div class="tp" data-t="${k}">${n}${k==='pp'?'<small>have / has / had ＋</small>':''}</div>`).join('');
    tp.classList.add('show');
    tp.querySelectorAll('.tp').forEach(b=>b.onclick=()=>{
     if(stage!=='tense')return;stage='done';
     const good=b.dataset.t===s.tense;
     tp.querySelectorAll('.tp').forEach(x=>{
      if(x.dataset.t===s.tense)x.classList.add('right');
      else if(x===b)x.classList.add('wrong');});
     const vv=VI[s.verb]||{};
     fb.className='fb show '+(good?'good':'bad');
     fb.innerHTML=(good?'✅ 對！':'❌ 差一步！')+
      ` <b>${s.form}</b> 是 <b>${s.verb}</b> 的<b>${TENSE_ZH[s.tense]}</b>`+
      `（${s.verb} → ${vv.ved||'?'} → ${vv.vpp||'?'}）`+
      (vv.trap?`<br>⚠️ ${vv.trap}`:'');
     finish(good);
    });
   }else{
    if(tf.has(tapped)&&s.has){/* 點到目標形態但拼字不同不可能，保留 */}
    w.classList.add('no');setTimeout(()=>w.classList.remove('no'),600);
    fb.className='fb show bad';
    fb.textContent='不是這個字，再找找（提示：想想三態的長相）';
   }
  });
  nb.onclick=()=>{
   if(stage!=='hunt')return;stage='done';
   const good=!s.has;
   nb.classList.add(good?'hit':'no');
   const vv=VI[s.verb]||{};
   fb.className='fb show '+(good?'good':'bad');
   fb.innerHTML=good?`✅ 對！這句用的是別的動詞（${s.verb}）`
    :`❌ 有喔！<b>${s.form}</b> 就在句子裡——它是 ${s.verb} 的${TENSE_ZH[s.tense]}`;
   if(!good)reveal();
   finish(good);
  };
  holder.appendChild(box);
 });
}
newRound();
</script>
