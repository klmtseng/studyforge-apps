<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>規律考古學家</title>
<style>
 *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
 :root{--bg:#0f1420;--card:#1a2130;--card2:#232c3f;--tx:#e8edf6;--dim:#95a0b5;--line:#2c3547;
   --ok:#28c76f;--bad:#ea5455;--warn:#ff9f43;--blue:#4f8cff;--gold:#f6c343}
 body{font-family:-apple-system,"PingFang TC","Noto Sans TC",system-ui,sans-serif;
   background:var(--bg);color:var(--tx);line-height:1.55;-webkit-text-size-adjust:100%;
   min-height:100vh;display:flex;flex-direction:column}
 .warnbar{background:#5b2530;color:#fff;padding:10px 14px;font-size:13px;text-align:center}
 header{padding:16px 16px 8px;text-align:center}
 h1{font-size:19px}
 .sub{color:var(--dim);font-size:12px;margin-top:2px}
 nav{display:flex;gap:8px;padding:10px 14px;position:sticky;top:0;z-index:10;
   background:linear-gradient(180deg,var(--bg) 75%,transparent)}
 .navbtn{flex:1;padding:10px 4px;text-align:center;border-radius:12px;font-size:14px;
   background:var(--card);border:1px solid var(--line);color:var(--dim);cursor:pointer;user-select:none}
 .navbtn.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
 main{flex:1;padding:6px 14px 40px;max-width:640px;margin:0 auto;width:100%}
 footer{padding:14px;text-align:center;color:#4a5468;font-size:10.5px}
 .hidden{display:none!important}

 /* ===== 回合列表 ===== */
 .prog{color:var(--dim);font-size:13px;text-align:center;margin-top:8px}
 .rcard{display:flex;align-items:center;gap:12px;border-radius:14px;border:1px solid var(--line);
   background:var(--card);margin-top:10px;padding:14px;cursor:pointer;user-select:none}
 .rcard.lock{opacity:.45;cursor:default}
 .rnum{width:34px;height:34px;border-radius:50%;background:var(--card2);flex:none;
   display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
 .rcard.done .rnum{background:#1e5138}
 .rtitle{font-size:15.5px;font-weight:700}
 .rmeta{font-size:12px;color:var(--dim);margin-top:1px}
 .rstars{margin-left:auto;font-size:14px;color:var(--gold);flex:none}

 /* ===== 挖掘現場 ===== */
 .backbtn{display:inline-block;margin-top:8px;font-size:13px;color:var(--dim);cursor:pointer;
   padding:6px 12px;border:1px solid var(--line);border-radius:10px;user-select:none}
 .story{margin-top:10px;padding:12px 14px;border-radius:12px;background:var(--card);
   border:1px solid var(--line);font-size:13.5px;color:#cdd6e6}
 .story b{color:var(--gold)}
 .traylabel{margin-top:12px;font-size:12px;color:var(--dim)}
 .tray{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;min-height:52px;padding:8px;
   border-radius:12px;border:1.5px dashed var(--line)}
 .vcard{padding:8px 11px;border-radius:11px;background:var(--card2);border:1.5px solid var(--line);
   cursor:pointer;user-select:none;text-align:center;max-width:100%}
 .vcard .f{font-size:14px;font-weight:700}
 .vcard .f i{font-style:normal;color:var(--gold)}
 .vcard .f u{text-decoration:none;color:#9ad0ff}
 .vcard .z{font-size:10.5px;color:var(--dim);margin-top:1px}
 .vcard.sel{border-color:var(--blue);background:rgba(79,140,255,.22);transform:scale(1.06)}
 .vcard.bad{animation:shake .5s;border-color:var(--bad)}
 @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
 .pits{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
 .pits.p3{grid-template-columns:1fr 1fr 1fr}
 @media (max-width:430px){.pits.p3{grid-template-columns:1fr 1fr}}
 .pit{border-radius:14px;border:1.5px solid var(--line);background:rgba(26,33,48,.6);
   min-height:110px;padding:8px;cursor:pointer}
 .pit.hot{border-color:var(--blue);background:rgba(79,140,255,.1)}
 .pitname{font-size:12px;color:var(--dim);text-align:center;font-weight:700;margin-bottom:6px}
 .pit .vcard{display:inline-block;margin:3px;padding:5px 8px}
 .pit .vcard .f{font-size:13px}
 .pit .vcard .z{display:none}
 .digbar{display:flex;gap:10px;margin-top:14px;align-items:center}
 .checkbtn{flex:1;padding:14px;border-radius:14px;font-size:16px;font-weight:700;text-align:center;
   cursor:pointer;user-select:none;border:none;color:#fff;background:var(--blue)}
 .checkbtn:disabled{background:var(--card2);color:#57627a}
 .tries{font-size:12px;color:var(--dim);flex:none}
 .msg{margin-top:10px;font-size:13.5px;text-align:center;min-height:20px}
 .msg.bad{color:var(--warn)}
 .msg.good{color:var(--ok)}
 .hintbox{margin-top:10px;padding:10px 12px;border-radius:12px;font-size:12.5px;color:#cdd6e6;
   background:rgba(255,159,67,.08);border-left:3px solid var(--warn)}
 .hintbox b{color:var(--warn)}

 /* ===== 鑑定結果(揭曉) ===== */
 .fam{border-radius:14px;border:1px solid var(--line);background:var(--card);margin-top:12px;overflow:hidden}
 .famhead{display:flex;align-items:center;gap:9px;padding:12px 14px}
 .fdot{width:12px;height:12px;border-radius:50%;flex:none}
 .famname{font-size:15.5px;font-weight:800;flex:1}
 .newtag{font-size:11px;padding:2px 9px;border-radius:10px;background:rgba(40,199,111,.18);color:var(--ok);flex:none}
 .revtag{font-size:11px;padding:2px 9px;border-radius:10px;background:var(--card2);color:var(--dim);flex:none}
 .famhint{padding:0 14px 8px;font-size:12.5px;color:var(--dim)}
 .ftable{width:100%;border-collapse:collapse;font-size:14px}
 .ftable th{font-size:11px;color:var(--dim);font-weight:400;padding:3px 6px;border-top:1px solid #202839}
 .ftable td{padding:6px;border-top:1px solid #202839;text-align:center}
 .ftable td:first-child{font-weight:700}
 .ftable td.ved{color:var(--gold)}
 .ftable td.vpp{color:#9ad0ff}
 .ftable td.zh{color:var(--dim);font-size:12px}
 .trapline{font-size:11.5px;color:var(--warn);background:rgba(255,159,67,.07);padding:4px 12px}
 .more{padding:8px 14px;font-size:12px;color:var(--dim);border-top:1px solid #202839}
 .rulebox{padding:10px 14px 14px;border-top:1px solid #202839}
 .rulebox label{font-size:12.5px;color:var(--ok);font-weight:700}
 .rulebox textarea{width:100%;margin-top:6px;background:var(--card2);color:var(--tx);
   border:1px solid var(--line);border-radius:10px;padding:9px;font-size:14px;font-family:inherit;
   min-height:52px;resize:vertical}
 .completebtn{width:100%;margin-top:14px;padding:15px;border-radius:14px;border:none;color:#fff;
   font-size:16px;font-weight:800;background:var(--ok);cursor:pointer}
 .completebtn:disabled{background:var(--card2);color:#57627a}
 .completenote{text-align:center;font-size:11.5px;color:var(--dim);margin-top:6px}
 .bigstars{text-align:center;font-size:30px;margin-top:12px;letter-spacing:4px}

 /* ===== 圖鑑 ===== */
 .gcard{border-radius:14px;border:1px solid var(--line);background:var(--card);margin-top:10px;overflow:hidden}
 .ghead{display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer;user-select:none}
 .gname{font-size:15px;font-weight:700;flex:1}
 .gnum{font-size:12px;color:var(--dim);flex:none}
 .ghint{padding:0 14px 10px;color:var(--dim);font-size:12.5px}
 .gbody{display:none;border-top:1px solid var(--line)}
 .gcard.open .gbody{display:block}
 .gcard.lockg{opacity:.5}
 .vrow{display:flex;align-items:baseline;gap:7px;padding:8px 14px;border-top:1px solid #202839;flex-wrap:wrap;font-size:14px}
 .vrow:first-child{border-top:none}
 .vrow b{min-width:74px}
 .vrow .ved{color:var(--gold)}
 .vrow .vpp{color:#9ad0ff}
 .vrow .zh{color:var(--dim);font-size:11.5px;margin-left:auto}
 .dug{font-size:11px}
 .latertag{font-size:10px;color:var(--dim);border:1px solid var(--line);border-radius:8px;padding:0 6px}

 /* ===== 筆記本 ===== */
 .notecard{border-radius:14px;border:1px solid var(--line);background:var(--card);margin-top:10px;padding:12px 14px}
 .notecard textarea{width:100%;margin-top:8px;background:var(--card2);color:var(--tx);
   border:1px solid var(--line);border-radius:10px;padding:9px;font-size:14px;font-family:inherit;
   min-height:48px;resize:vertical}
 .emptynote{color:var(--dim);text-align:center;padding:40px 20px;font-size:13.5px}
 .resetbtn{display:block;margin:26px auto 0;padding:9px 20px;border-radius:12px;font-size:12px;
   border:1px solid var(--line);background:none;color:#57627a;cursor:pointer}

 /* 彩带 */
 .confetti{position:fixed;top:-30px;font-size:20px;z-index:99;pointer-events:none;animation:fall linear forwards}
 @keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.4}}
</style>
</head>

function nextRoundIdx(){for(let i=0;i<R.length;i++)if(!S.done[R[i].id])return i;return R.length}
function boom(){const em=["🎉","🏺","✨","⭐"];for(let i=0;i<22;i++){const c=el("span","confetti",em[i%4]);
  c.style.left=Math.random()*100+"vw";c.style.animationDuration=(1.6+Math.random()*1.6)+"s";
  document.body.appendChild(c);setTimeout(()=>c.remove(),3400)}}

/* ---------- 導覽 ---------- */
document.querySelectorAll(".navbtn").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".navbtn").forEach(x=>x.classList.toggle("on",x===b));
  ["dig","dex","note"].forEach(v=>$("#view-"+v).classList.toggle("hidden",v!==b.dataset.v));
  if(b.dataset.v==="dex")renderDex(); if(b.dataset.v==="note")renderNote();
  if(b.dataset.v==="dig"&&!P)renderRoundList();
});

/* ---------- 回合列表 ---------- */
function renderRoundList(){
  $("#digscene").classList.add("hidden");$("#digscene").innerHTML="";
  const box=$("#roundlist");box.classList.remove("hidden");box.innerHTML="";
  const disc=discovered();
  box.appendChild(el("div","prog",`已發現 <b style="color:var(--gold)">${disc.size}</b> / ${GIDS.length} 個家族　‧　收藏化石 ${dugVerbs().size} / ${Object.keys(V).length} 塊`));
  const nxt=nextRoundIdx();
  R.forEach((r,i)=>{
    const done=S.done[r.id],unlocked=i<=nxt;
    const c=el("div","rcard"+(done?" done":"")+(unlocked?"":" lock"));
    c.appendChild(el("div","rnum",done?"✓":(unlocked?String(i+1):"🔒")));
    const mid=el("div","");
    mid.appendChild(el("div","rtitle",esc(r.title)));
    const nNew=r.families.filter(f=>f.new).length,nCards=r.families.reduce((a,f)=>a+f.verbs.length,0);
    mid.appendChild(el("div","rmeta",`${nCards} 塊化石 ‧ ${nNew} 個新家族${r.families.length-nNew?` ‧ 含複習`:""}`));
    c.appendChild(mid);
    if(done)c.appendChild(el("div","rstars","★".repeat(done)+"☆".repeat(3-done)));
    if(unlocked)c.onclick=()=>openRound(i);
    box.appendChild(c);
  });
  if(nxt>=R.length){
    const d=el("div","story","🏆 <b>全遺跡挖掘完成！</b>13 個家族全數出土。到圖鑑看看你的收藏，或重玩任何回合拿三顆星。");
    box.appendChild(d);
  }
}

/* ---------- 挖掘現場 ---------- */
let P=null; // 進行中回合狀態
function persistP(){ // 中途離開/刷新可續玩（G5 修正）
  S.cur=P?{i:P.i,tray:P.tray,pits:P.pits,tries:P.tries,revealed:P.revealed}:null;save();
}
function restoreP(){
  const c=S.cur;
  if(!c||!R[c.i])return false;
  const want=new Set(R[c.i].families.flatMap(f=>f.verbs));
  const got=[...(c.tray||[]),...(c.pits||[]).flat()];
  if(got.length!==want.size||!got.every(v=>want.has(v)))return false; // 資料改版就放棄舊局
  P={i:c.i,r:R[c.i],tray:c.tray,pits:c.pits,sel:null,tries:c.tries||0,revealed:!!c.revealed};
  return true;
}
function openRound(i){
  const r=R[i];
  const cards=shuf(r.families.flatMap(f=>f.verbs),seedOf(r.id));
  P={i,r,tray:cards,pits:r.families.map(()=>[]),sel:null,tries:0,revealed:false};
  $("#roundlist").classList.add("hidden");
  renderDig("");
}
function cardEl(v,where){
  const info=V[v];
  const c=el("div","vcard"+(P.sel===v?" sel":""));
  c.dataset.v=v;
  c.appendChild(el("div","f",`${esc(v)} → <i>${esc(info.ved)}</i> → <u>${esc(info.vpp)}</u>`));
  c.appendChild(el("div","z",esc(info.zh)));
  c.onclick=e=>{e.stopPropagation();
    if(where==="tray"){P.sel=(P.sel===v?null:v);renderDig()}
    else{const p=P.pits[where];p.splice(p.indexOf(v),1);P.tray.push(v);P.sel=null;renderDig()}
  };
  return c;
}
function renderDig(msg,msgCls){
  persistP();
  const sc=$("#digscene");sc.classList.remove("hidden");sc.innerHTML="";
  const r=P.r;
  const back=el("div","backbtn","← 回合列表");
  back.onclick=()=>{P=null;persistP();renderRoundList()};
  sc.appendChild(back);
  sc.appendChild(el("div","story",`<b>第 ${P.i+1} 站｜${esc(r.title)}</b><br>${esc(r.story)}`));
  if(P.revealed)return renderReveal(sc);
  sc.appendChild(el("div","traylabel",P.sel?"👉 點一個坑放進去（再點選中的卡可取消）":"點一塊化石，再點要放進的坑："));
  const tray=el("div","tray");
  P.tray.forEach(v=>tray.appendChild(cardEl(v,"tray")));
  if(!P.tray.length)tray.appendChild(el("div","traylabel","（化石都放進坑裡了，按「鑑定」！）"));
  sc.appendChild(tray);
  const pits=el("div","pits"+(P.pits.length>2?" p3":""));
  P.pits.forEach((p,pi)=>{
    const pit=el("div","pit"+(P.sel?" hot":""));
    pit.appendChild(el("div","pitname",`坑 ${"ABCD"[pi]}（${p.length}）`));
    p.forEach(v=>pit.appendChild(cardEl(v,pi)));
    pit.onclick=()=>{if(P.sel){P.pits[pi].push(P.sel);P.tray.splice(P.tray.indexOf(P.sel),1);P.sel=null;renderDig()}};
    pits.appendChild(pit);
  });
  sc.appendChild(pits);
  const bar=el("div","digbar");
  const btn=el("button","checkbtn","🔍 鑑定");
  btn.disabled=P.tray.length>0;
  btn.onclick=check;
  bar.appendChild(btn);
  bar.appendChild(el("div","tries",P.tries?`已鑑定 ${P.tries} 次`:""));
  sc.appendChild(bar);
  if(msg)sc.appendChild(el("div","msg "+(msgCls||""),msg));
  if(P.tries>=2){
    const hb=el("div","hintbox","<b>🔦 考古隊的線索</b>——這一站的家族特徵："+
      P.r.families.map(f=>`<br>‧ ${esc(G[f.g].hint)}`).join(""));
    sc.appendChild(hb);
  }
}
function check(){
  const fams=P.r.families.map(f=>f.g);
  // 每個家族的「主坑」= 該家族卡片最多的坑
  const home={};
  fams.forEach(g=>{let best=0,bc=-1;
    P.pits.forEach((p,i)=>{const c=p.filter(v=>V[v].g===g).length;if(c>bc){bc=c;best=i}});
    home[g]=best});
  const perfect=P.pits.every((p,i)=>p.length&&p.every(v=>home[V[v].g]===i))
    &&new Set(Object.values(home)).size===fams.length;
  P.tries++;
  if(perfect){P.revealed=true;boom();renderDig();window.scrollTo({top:0});return}
  // 放錯的卡退回盤子
  const wrong=[];
  P.pits.forEach((p,i)=>{for(let k=p.length-1;k>=0;k--){const v=p[k];
    if(home[V[v].g]!==i){wrong.push(v);p.splice(k,1)}}});
  wrong.forEach(v=>P.tray.push(v));
  renderDig(wrong.length?`有 ${wrong.length} 塊化石放錯坑，退回給你了——仔細看它們「變身的方式」！`
    :"每個坑要住「一個家族」——現在有家族擠在同一個坑裡，把它們分開！","bad");
  document.querySelectorAll(".tray .vcard").forEach(c=>{if(wrong.includes(c.dataset.v))c.classList.add("bad")});
}

/* ---------- 揭曉 ---------- */
function renderReveal(sc){
  sc.appendChild(el("div","msg good","🎉 鑑定成功！這一站的家族出土了——"));
  sc.appendChild(el("div","bigstars",starsOf(P.tries,true)));
  const fams=[...P.r.families].sort((a,b)=>(b.new?1:0)-(a.new?1:0));
  const tas=[];
  fams.forEach(f=>{
    const g=G[f.g];
    const box=el("div","fam");
    const head=el("div","famhead");
    const dot=el("div","fdot");dot.style.background=safeColor(g.color);
    head.appendChild(dot);
    head.appendChild(el("div","famname",esc(g.name)));
    head.appendChild(el("div",f.new?"newtag":"revtag",f.new?"⭐ 新發現！":"複習"));
    box.appendChild(head);
    box.appendChild(el("div","famhint",esc(g.hint)));
    const t=el("table","ftable","<tr><th>原形</th><th>過去式</th><th>過去分詞</th><th>意思</th></tr>");
    f.verbs.forEach(v=>{const o=V[v];
      t.insertAdjacentHTML("beforeend",
        `<tr><td>${esc(v)}</td><td class="ved">${esc(o.ved)}</td><td class="vpp">${esc(o.vpp)}</td><td class="zh">${esc(o.zh)}</td></tr>`)});
    box.appendChild(t);
    f.verbs.forEach(v=>{if(V[v].trap)box.appendChild(el("div","trapline",`⚠️ ${esc(v)}：${esc(V[v].trap)}`))});
    const others=Object.values(V).filter(o=>o.g===f.g&&!f.verbs.includes(o.v)).map(o=>o.v);
    if(others.length)box.appendChild(el("div","more","這家族還有："+others.map(esc).join("、")+"（圖鑑裡看全表）"));
    if(f.new){
      const rb=el("div","rulebox");
      rb.innerHTML=`<label>✍️ 用你自己的話，寫下「${esc(g.name)}」的變身規則：</label>`;
      const ta=document.createElement("textarea");
      ta.placeholder="例：這一族的字……";
      ta.value=S.rules[f.g]||"";
      ta.oninput=()=>{S.rules[f.g]=ta.value.trim();save();upd()};
      rb.appendChild(ta);box.appendChild(rb);tas.push(f.g);
    }
    sc.appendChild(box);
  });
  const btn=el("button","completebtn","🏺 收進圖鑑，完成這一站");
  const note=el("div","completenote","");
  function upd(){const miss=tas.filter(g=>!(S.rules[g]||"").length);
    btn.disabled=miss.length>0;
    note.textContent=miss.length?"把上面每個新家族的規則寫一句（自己的話就好），才能收進筆記本":"";}
  upd();
  btn.onclick=()=>{
    const stars=P.tries<=1?3:P.tries===2?2:1;
    S.done[P.r.id]=Math.max(S.done[P.r.id]||0,stars);
    P=null;persistP();renderRoundList();window.scrollTo({top:0});
  };
  sc.appendChild(btn);sc.appendChild(note);
}
const starsOf=(tries,big)=>{const n=tries<=1?3:tries===2?2:1;return "★".repeat(n)+"☆".repeat(3-n)};

/* ---------- 圖鑑 ---------- */
function renderDex(){
  const box=$("#view-dex");box.innerHTML="";
  const disc=discovered(),dug=dugVerbs();
  box.appendChild(el("div","prog",`出土家族 ${disc.size}/${GIDS.length}——點家族看全族三態表`));
  GIDS.forEach(gid=>{
    const g=G[gid],members=Object.values(V).filter(o=>o.g===gid);
    const open=disc.has(gid);
    const c=el("div","gcard"+(open?"":" lockg"));
    const head=el("div","ghead");
    const dot=el("div","fdot");dot.style.background=open?safeColor(g.color):"#39435a";
    head.appendChild(dot);
    head.appendChild(el("div","gname",open?esc(g.name):"？？？（尚未出土）"));
    head.appendChild(el("div","gnum",`${members.filter(m=>dug.has(m.v)).length}/${members.length}`));
    c.appendChild(head);
    if(open){
      c.appendChild(el("div","ghint",esc(g.hint)));
      const body=el("div","gbody");
      members.forEach(m=>{
        const r=el("div","vrow");
        r.innerHTML=`<b>${esc(m.v)}</b><span class="ved">${esc(m.ved)}</span><span class="vpp">${esc(m.vpp)}</span>`+
          (dug.has(m.v)?`<span class="dug">⭐</span>`:`<span class="latertag">後續出土</span>`)+
          `<span class="zh">${esc(m.zh)}</span>`;
        body.appendChild(r);
      });
      c.appendChild(body);
      head.onclick=()=>c.classList.toggle("open");
    }
    box.appendChild(c);
  });
}

/* ---------- 筆記本 ---------- */
function renderNote(){
  const box=$("#view-note");box.innerHTML="";
  const disc=discovered();
  if(!disc.size){box.appendChild(el("div","emptynote","筆記本還是空的。<br>去「挖掘」發現第一個家族，把你自己歸納的規則寫進來！"));return}
  box.appendChild(el("div","prog","這些規則是你自己發現的——考前看這頁，比看課本表格快"));
  GIDS.forEach(gid=>{
    if(!disc.has(gid))return;
    const g=G[gid];
    const c=el("div","notecard");
    c.innerHTML=`<span class="fdot" style="display:inline-block;background:${safeColor(g.color)}"></span> <b>${esc(g.name)}</b>`;
    const ta=document.createElement("textarea");
    ta.value=S.rules[gid]||"";ta.placeholder="我的規則…";
    ta.oninput=()=>{S.rules[gid]=ta.value.trim();save()};
    c.appendChild(ta);
    box.appendChild(c);
  });
  const rb=el("button","resetbtn","重新開始整個遺跡（清除全部進度）");
  rb.onclick=()=>{if(confirm("確定要清掉所有進度、星星和筆記嗎？")){localStorage.removeItem(LS);location.reload()}};
  box.appendChild(rb);
}

if(restoreP()){$("#roundlist").classList.add("hidden");renderDig("")}
else renderRoundList();
</script>
